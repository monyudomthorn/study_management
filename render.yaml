services:
  # Laravel Web Service
  - type: web
    name: study-management-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: "Study Management API"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: study-management-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: study-management-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: study-management-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: study-management-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: study-management-db
          property: password

databases:
  - name: study-management-db
    databaseName: study_management
    user: root
    plan: free
    region: singapore
